name: Aggiorna knowledge FC27

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fc27-knowledge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Aggiorna knowledge FC27 (YouTube RSS + Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_VIDEO_ANALYSES: 2
          LOOKBACK_DAYS: 14
        run: node scripts/update-fc27-knowledge.mjs

      - name: Salva knowledge aggiornata
        run: |
          git config user.name "fc27-knowledge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/fc27-knowledge.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento da salvare."
          else
            git commit -m "chore: aggiorna knowledge FC27"
            git push
          fi
