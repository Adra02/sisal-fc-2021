function compact(d){const r=teamMetrics(d,5),recentList=recentStats(d.matches,d.team.id,5).matches,o=overall(d),available=hasClubData(d);return{dataStatus:{available,players:d.players.length,matches:d.matches.length,fetchedAt:d.team?.fetchedAt||null,source:d.team?.source||null},team:{...d.team},summary:{cumulative:{matches:o.sample,wins:o.wins,draws:o.draws,losses:o.losses,goals:o.goals,against:o.against,winRate:o.winRate},recent5:{matches:r.sample,wins:r.wins,draws:r.draws,losses:r.losses,goals:r.goals,against:r.against,winRate:r.sample?100*r.wins/r.sample:0,passMade:r.passMade,passAttempts:r.passAttempts,passRate:r.passRate,tackleMade:r.tackleMade,tackleAttempts:r.tackleAttempts,tackleRate:r.tackleRate}},players:d.players.map(p=>({name:p.name,pos:p.position||null,observedDepartment:p.observedDepartment||null,ovr:p.ovr||null,games:p.games||0,goals:p.goals||0,assists:p.assists||0,rating:p.rating?Number(num(p.rating).toFixed(2)):null,passMade:p.passAttempts>0?p.passesMade:(p.matchAggregate?.passesMade??0),passAttempts:p.passAttempts>0?p.passAttempts:(p.matchAggregate?.passAttempts??0),pass:p.passAttempts>0?Number(pct(p.passesMade,p.passAttempts).toFixed(1)):(p.passAccuracy!=null?Number(p.passAccuracy): (p.matchAggregate?.passAttempts?Number(pct(p.matchAggregate.passesMade,p.matchAggregate.passAttempts).toFixed(1)):null)),tackleMade:p.tackleAttempts>0?p.tacklesMade:(p.matchAggregate?.tacklesMade??0),tackleAttempts:p.tackleAttempts>0?p.tackleAttempts:(p.matchAggregate?.tackleAttempts??0),tackle:p.tackleAttempts>0?Number(pct(p.tacklesMade,p.tackleAttempts).toFixed(1)):(p.tackleSuccess!=null?Number(p.tackleSuccess):(p.matchAggregate?.tackleAttempts?Number(pct(p.matchAggregate.tacklesMade,p.matchAggregate.tackleAttempts).toFixed(1)):null)),recent5:p.recent5?{games:p.recent5.appearances,goals:p.recent5.goals,assists:p.recent5.assists,rating:p.recent5.rating,passMade:p.recent5.passesMade,passAttempts:p.recent5.passAttempts,pass:p.recent5.passRate,tackleMade:p.recent5.tacklesMade,tackleAttempts:p.recent5.tackleAttempts,tackle:p.recent5.tackleRate}:null})),recent5:recentList.map(m=>{const own=m.clubs.find(c=>String(c.id)===String(d.team.id))||m.clubs[0],op=m.clubs.find(c=>String(c.id)!==String(own?.id))||m.clubs[1];return{date:formatDate(m.timestamp),matchId:m.id,opponent:op?.name||'Avversario',for:num(own?.goals),against:num(op?.goals),result:num(own?.goals)>num(op?.goals)?'W':num(own?.goals)<num(op?.goals)?'L':'D'}})}}
function formationForAI(d){const map=state.lineups[state.formation]||{};return{formation:state.formation,players:(FORM_ROWS[state.formation]||[]).map((role,i)=>{const p=d.players.find(x=>String(x.id)===String(map[i]));return{slot:i+1,role,player:p?{name:p.name,position:p.position||null,observedDepartment:p.observedDepartment||null,ovr:p.ovr||null,total:{games:p.games||0,goals:p.goals||0,assists:p.assists||0,rating:p.rating||null},recent5:p.recent5?{games:p.recent5.appearances,goals:p.recent5.goals,assists:p.recent5.assists,rating:p.recent5.rating}:null}:null}}),tactics:state.tactics}}
async function callAI(question,mode='normal'){const id=mode==='opponent'?'opAIResult':'aiResult';let out=el(id);if(!question){out.textContent='Scrivi una domanda.';return}out.textContent='Preparazione dati IA…';const btn=mode==='opponent'?el('askOpponentAI'):el('askAI');if(btn)btn.disabled=true;try{if(location.protocol==='file:')throw Error('Pubblica il progetto su Vercel prima di usare l’IA.');let own=getOwn(),opp=(state.opPlayers.length||state.opMatches.length)?getOpp():null;const ownName=cleanClubName(state.ownName||DEFAULT_OWN_NAME);if(!hasClubData(own)||!cacheGet('own',ownName)){await syncClub('own');own=getOwn();out=el(id);if(!hasClubData(own))throw Error('Non sono disponibili dati reali della squadra. Sincronizzazione completata senza dati leggibili.')}if(mode==='opponent'){if(!state.opName)throw Error('Inserisci prima il nome dell’avversario nella sezione “I tuoi dati”.');const oppName=cleanClubName(state.opName);if(!opp||!cacheGet('opponent',oppName)){await syncClub('opponent');opp=getOpp();out=el(id);if(!hasClubData(opp))throw Error('Non sono disponibili dati reali dell’avversario. Sincronizzazione completata senza dati leggibili.')}}out.textContent='Analisi in corso…';const r=await fetch('/api/assistente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,mode,notes:state.notes,team:compact(own),opponent:opp?compact(opp):null,formation:formationForAI(own),knowledge:state.knowledge})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||`Errore HTTP ${r.status}`);out.textContent=data.answer||'Nessuna risposta ricevuta.'}catch(e){out=el(id)||out;out.textContent='Errore IA: '+e.message}finally{const currentBtn=mode==='opponent'?el('askOpponentAI'):el('askAI');if(currentBtn)currentBtn.disabled=false}}
async function syncClub(kind){const isOwn=kind==='own',input=el(isOwn?'ownName':'opName'),name=cleanClubName(input?input.value:(isOwn?state.ownName:state.opName)),box=el(isOwn?'ownMessages':'opMessages'),lockKey=cacheKey(kind,name);if(isOwn){state.ownName=name;jset(K.ownName,name)}else{state.opName=name;jset(K.opName,name)}if(syncLocks.has(lockKey))return syncLocks.get(lockKey);const cached=cacheGet(kind,name);if(cached){try{const applied=applySyncData(kind,cached.data,true);if(box)box.innerHTML=`<div class="message ok">✓ ${esc(applied.clubName)}: dati già aggiornati poco fa. Nessuna richiesta esterna effettuata.</div>`;showToast(`✓ ${applied.clubName}: cache locale usata`);setHeader();render();return applied}catch(error){cacheBucket()[lockKey]=undefined;jset(K.syncCache,cacheBucket())}}const work=(async()=>{const btn=el(isOwn?'syncOwn':'syncOpp');try{state.syncing=kind;if(btn)btn.disabled=true;if(box)box.innerHTML='<div class="message">⏳ Recupero dati live da EA: club, statistiche giocatori e ultime partite…</div>';const r=await fetch('/api/club-ai-sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,platform:'common-gen5',role:isOwn?'own':'opponent'})});const data=await r.json().catch(()=>({}));if(!r.ok){let msg=String(data.error||`Errore server ${r.status}`);if(data.model)msg+=` · modello ${data.model}`;if(data.quota?.id){msg+=` · ${data.quota.id}`;if(data.quota.limit)msg+=` · limite ${data.quota.limit}`;if(data.quota.retryAfterSeconds!=null)msg+=` · retry suggerito ${data.quota.retryAfterSeconds}s`;}else if(data.detail){msg+=` · ${String(data.detail).slice(0,260)}`;}throw Error(msg)}const applied=applySyncData(kind,data,false);const cachedData={...data,cachedAt:Date.now()};cacheSave(kind,name,cachedData);const sec=data.sections||{};const flags=`Stats ${sec.stats?.available?'✓':'—'} · Fun ${sec.fun?.available?'✓':'—'} · Players ${applied.players.length} · Matches ${applied.matches.length}`;if(box)box.innerHTML=`<div class="message ok">✓ ${esc(applied.clubName)} aggiornato dai server EA · ${esc(flags)} · dati ora in cache per 10 minuti.</div>`;showToast(`✓ ${applied.clubName} sincronizzato da EA`);setHeader();render();return applied}catch(e){const message=String(e?.message||'Errore durante la sincronizzazione.');if(box)box.innerHTML=`<div class="message err">✕ ${esc(message)}</div>`;showToast('Sincronizzazione non riuscita',true);throw e}finally{state.syncing='';if(btn)btn.disabled=false}})();syncLocks.set(lockKey,work);try{return await work}finally{syncLocks.delete(lockKey)}}
async function syncBoth(){const own=el('ownName'),opp=el('opName');if(own)state.ownName=own.value.trim();if(opp)state.opName=opp.value.trim();try{await syncClub('own');if(state.opName)await syncClub('opponent')}catch(e){/* Il messaggio della singola sincronizzazione spiega l'errore. */}}
function clearClub(kind){const isOwn=kind==='own',oldName=isOwn?(state.ownName||DEFAULT_OWN_NAME):(state.opName||'');if(oldName)cacheDelete(kind,oldName);if(isOwn){state.players=[];state.matches=[];state.ownMeta=null;state.ownName=DEFAULT_OWN_NAME;state.ownClubId=DEFAULT_OWN_ID;jdel(K.players);jdel(K.matches);jdel(K.ownMeta);jset(K.ownName,state.ownName);jset(K.ownClubId,state.ownClubId)}else{state.opPlayers=[];state.opMatches=[];state.opMeta=null;state.opName='';state.opClubId='';jdel(K.opPlayers);jdel(K.opMatches);jdel(K.opMeta);jset(K.opName,'');jset(K.opClubId,'')}setHeader();render();showToast(isOwn?'Dati squadra cancellati':'Dati avversario cancellati')}

}
function renderPitchDotsOnly(){if(state.tab==='pitch')render()}
function playerModal(id){const p=getOwn().players.find(x=>String(x.id)===String(id));if(!p)return;const trend=trendLabel(p);el('modalRoot').innerHTML=`<div class="modal" id="playerModal"><div class="modal-inner"><div class="modal-head"><div><div class="kicker">SCHEDA GIOCATORE</div><h2 style="margin:5px 0">${esc(p.name)}</h2><div class="muted">${esc(p.position||p.observedDepartment||'Posizione n/d')}</div></div><button class="close" onclick="document.getElementById('modalRoot').innerHTML=''">✕</button></div><div class="stats-grid"><div class="stat"><strong>${p.ovr||'N/D'}</strong><span>OVR</span></div><div class="stat"><strong>${p.games||0}</strong><span>Presenze cumulative</span></div><div class="stat"><strong>${p.goals||0}</strong><span>Gol</span></div><div class="stat"><strong>${p.assists||0}</strong><span>Assist</span></div><div class="stat"><strong>${p.rating?num(p.rating).toFixed(2):'—'}</strong><span>Voto medio</span></div><div class="stat"><strong>${p.passAttempts?pct(p.passesMade,p.passAttempts).toFixed(1)+'%':'—'}</strong><span>Passaggi</span></div><div class="stat"><strong>${p.tackleAttempts?pct(p.tacklesMade,p.tackleAttempts).toFixed(1)+'%':'—'}</strong><span>Contrasti</span></div><div class="stat"><strong>${p.recent5Games||0}</strong><span>PG ultime 5</span></div></div><div class="grid2" style="margin-top:10px"><div class="card"><h3>📊 Trend ultime 5</h3><div class="muted">Rating recente: ${p.recent5Rating==null?'—':num(p.recent5Rating).toFixed(2)} · gol ${p.recent5Goals||0} · assist ${p.recent5Assists||0}</div><div class="tag ${trend.cls}" style="margin-top:8px">${esc(trend.txt)}</div></div><div class="card"><h3>📌 Reparto osservato</h3><div class="muted">${esc(p.observedDepartment||'N/D')} · posizione dichiarata: ${esc(p.position||'N/D')}</div></div></div></div></div>`}
window.addEventListener('keydown',e=>{if(e.key==='Escape')el('modalRoot').innerHTML=''});
async function loadKnowledge(){if(location.protocol==='file:')return;try{const r=await fetch('./knowledge/fc27-knowledge.json',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);state.knowledge=await r.json()}catch(e){state.knowledgeError=e.message||'non disponibile'}}
setHeader();render();loadKnowledge().then(()=>{if(state.tab==='ai')render()});
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js?v=11').catch(()=>{});
})();
</script>
