<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Sisal FC 2021 — Clubs Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">EA SPORTS FC 27 · CLUBS</div>
      <h1>SISAL FC 2021</h1>
      <div id="dataStatus" class="status">Nessun file caricato</div>
    </div>
    <div class="clubid">#328794<br><span>GEN 5</span></div>
  </header>

  <section class="upload-panel">
    <div class="upload-title">DATI DELLA SQUADRA</div>
    <p>Carica i tuoi file JSON direttamente dal dispositivo. I dati non sono inclusi nel codice del sito.</p>
    <label class="upload-button">
      <input id="fileInput" type="file" accept=".json,.txt,application/json,text/plain" multiple>
      <span>📁 Carica file JSON</span>
    </label>
    <button id="clearData" class="ghost-button" type="button">Svuota dati salvati</button>
    <div id="fileMessages" class="file-messages"></div>
  </section>

  <main id="content"></main>

  <nav class="bottomnav" aria-label="Navigazione">
    <button class="active" data-tab="team">⚡<span>Squadra</span></button>
    <button data-tab="players">👥<span>Giocatori</span></button>
    <button data-tab="top">🏆<span>Top 3</span></button>
    <button data-tab="pitch">⚽<span>Campo</span></button>
    <button data-tab="matches">🆚<span>Opposizioni</span></button>
    <button data-tab="ai">✦<span>IA</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
