  M.slice(0,20).forEach(m=>{const oid=Object.keys(m.clubs).find(k=>k!==id);if(!oid||seen.has(oid)||O.length>=8)return;seen.add(oid);const s=sumPlayers(m,oid);
    O.push({n:(m.clubs[oid].details||{}).name||oid,id:oid,r:s.g+"-"+s.ga,sh:s.sh,pm:s.pm,pa:s.pa,tm:s.tm,ta:s.ta,sv:s.sv,g:s.g,ts:m.timestamp,small:s.secs<3000?1:0,p:s.p})});
  if(keep){S.cmp=S.cmp.map(i=>Math.min(i,P.length-1))}else{S.cmp=[0,Math.min(1,P.length-1)];S.p=null;S.o=null}LAST=Date.now();
  if(!S.as||!Object.keys(S.as).length||!Object.values(S.as).every(n=>pn(n)))suggest();
  LS.s("club",info)}
async function pickOpp(info){
  const id=String(info.clubId||(info.clubInfo||{}).clubId);S.msg="Carico le sue partite…";render();
  try{const ms=(await ea("clubs/matches",{matchType:"leagueMatch",clubIds:id}).catch(()=>[])).filter(valid).sort((a,b)=>b.timestamp-a.timestamp).slice(0,6);
    const o={n:(info.clubInfo||{}).name||id,id,r:"",sh:0,pm:0,pa:0,tm:0,ta:0,sv:0,g:0,ts:(ms[0]||{}).timestamp||0,small:ms.length<3?1:0,p:[]},pp={};
    ms.forEach(m=>{const s=sumPlayers(m,id);["sh","pm","pa","tm","ta","sv","g"].forEach(k=>o[k]+=s[k]);s.p.forEach(x=>{const q=pp[x[0]]||(pp[x[0]]={c:x[1],n:0,r:0,g:0,a:0,tm:0,ta:0});q.n++;q.r+=x[2];q.g+=x[3];q.a+=x[4];q.tm+=x[5];q.ta+=x[6]})});
    o.p=Object.entries(pp).map(([n,q])=>[n,q.c,+(q.r/q.n).toFixed(1),q.g,q.a,q.tm,q.ta]);
    if(!o.p.length)throw new Error("nessun dato");
    O.unshift(o);S.o=0;S.msg="";S.res=[]}catch(e){S.msg="Non ci sono partite di campionato recenti per questo club."}
  render()}
async function search(sel){const n=(document.getElementById(sel)||{}).value||"";
  if(n.trim().length<3){S.msg="Scrivi almeno 3 lettere";render();return}
  S.msg="Cerco…";S.res=[];render();
  try{const r=await ea("allTimeLeaderboard/search",{clubName:n.trim()});S.res=Array.isArray(r)?r:Object.values(r||{});S.msg=S.res.length?"":"Nessun club trovato"}catch(e){S.msg="EA non risponde ora, riprova tra poco"}
  render()}
const resHtml=k=>`${S.msg?`<p class="mut">${esc(S.msg)}</p>`:""}<div class="chips">${(S.res||[]).slice(0,10).map((x,i)=>`<button data-a="${k}" data-v="${i}">${esc((x.clubInfo||{}).name||x.clubName||"?")} · div. ${esc(x.currentDivision||"?")}</button>`).join("")}</div>`;
const liveSearch=()=>`<div class="card"><h3>Cerca qualsiasi club</h3><div style="display:flex;gap:8px;margin-top:8px"><input id="os" placeholder="Nome del club" aria-label="Nome del club"><button class="btn" data-a="osearch">Cerca</button></div>${resHtml("opick")}</div>`;
const startView=()=>`<header><small>PRO CLUBS · FC 27</small><h1>Sisal FC 2021</h1></header><div class="card"><h3>Cerca il tuo club</h3><p class="mut">Scrivi il nome come appare nel gioco.</p><div style="display:flex;gap:8px"><input id="cs" placeholder="Nome del club" aria-label="Nome del club"><button class="btn" data-a="csearch">Cerca</button></div>${resHtml("pick")}</div>`;
async function start(info){S.ready=false;S.msg="Carico i dati del club…";S.res=[];render();
  try{await loadMine(info);S.ready=true;S.msg=""}catch(e){S.msg="Non riesco a leggere i dati di EA. Riprova tra poco."}
  render()}
async function refresh(force){
  if(!API||!S.ready||S.refreshing)return;
  const tg=(document.activeElement||{}).tagName||"";
  if(!force&&(S.o!==null||S.p!==null||S.busy||/INPUT|TEXTAREA|SELECT/.test(tg)))return;
  S.refreshing=true;
  try{await loadMine(LS.g("club",null),true)}catch(e){}
  S.refreshing=false;render()}
const tick=()=>{if(document.visibilityState==="visible"&&Date.now()-LAST>120000)refresh(false)};
setInterval(tick,30000);document.addEventListener("visibilitychange",tick);
function saveForm(){const el=document.getElementById("fn"),l=LS.g("forms",[]),name=((el&&el.value)||"").trim()||"Formazione "+(l.length+1),f={name,mod:S.mod,as:{...S.as}},i=l.findIndex(x=>x.name===name);
  if(i>=0)l[i]=f;else l.push(f);LS.s("forms",l);S.fmsg="Salvata: "+name}
function loadForm(i){const f=LS.g("forms",[])[i];if(!f)return;S.mod=f.mod;S.as={...f.as};LS.s("mod",f.mod);LS.s("as",S.as);S.fmsg="Caricata: "+f.name}
function delForm(i){const l=LS.g("forms",[]);S.fmsg="Eliminata: "+((l[i]||{}).name||"");l.splice(i,1);LS.s("forms",l)}
function copyForm(i){const f=LS.g("forms",[])[i];if(!f)return;const code=btoa(unescape(encodeURIComponent(JSON.stringify(f))));
  (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>{S.fmsg="Codice copiato: incollalo in chat ai compagni";S.fcode="";render()}).catch(()=>{S.fmsg="Non riesco a copiare da solo: tieni premuto il codice qui sotto e copialo.";S.fcode=code;render()})}
function importForm(){const el=document.getElementById("fi");try{const f=JSON.parse(decodeURIComponent(escape(atob((el.value||"").trim()))));if(!MODS[f.mod]||typeof f.as!=="object")throw 0;const l=LS.g("forms",[]);l.push({name:String(f.name||"Importata").slice(0,30),mod:f.mod,as:f.as});LS.s("forms",l);S.fmsg="Formazione importata"}catch(e){S.fmsg="Codice non valido"}}
function savedCard(){const l=LS.g("forms",[]);
  return `<div class="card"><h3>Formazioni salvate</h3><div style="display:flex;gap:8px;margin:10px 0"><input id="fn" placeholder="Nome (es. Titolare)" aria-label="Nome formazione"><button class="btn" data-a="fsave">Salva</button></div>${S.fmsg?`<p class="mut">${esc(S.fmsg)}</p>`:""}${S.fcode?`<p class="mut" style="word-break:break-all;user-select:all">${esc(S.fcode)}</p>`:""}${l.length?"":`<p class="mut">Nessuna formazione salvata. Quella che scegli resta comunque memorizzata su questo telefono.</p>`}${l.map((f,i)=>`<div class="res"><span><b>${esc(f.name)}</b> <span class="mut">${esc(f.mod)}</span></span><span><button class="back" data-a="fload" data-v="${i}">Carica</button> <button class="back" data-a="fcopy" data-v="${i}">Copia codice</button> <button class="back" data-a="fdel" data-v="${i}">Elimina</button></span></div>`).join("")}<label class="mut" for="fi">Hai il codice di un compagno?</label><div style="display:flex;gap:8px;margin-top:6px"><input id="fi" aria-label="Codice formazione"><button class="btn" data-a="fimp">Importa</button></div></div>`}
function render(){
  if(API&&!S.ready){app.innerHTML=startView();return}
  const T=[["team","Squadra"],["players","Giocatori"],["week","Classifica"],["form","Formazione"],["opp","Avversari"],["ai","Assistente"]];
  const view={team:teamView,players:playersView,week:weekView,form:formView,opp:oppView,ai:aiView}[S.tab]();
  app.innerHTML=`<header><small>PRO CLUBS · FC 27</small><h1>Sisal FC 2021</h1>${API?`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="mut">Aggiornato alle ${new Date(LAST).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</span><button class="back" data-a="refresh">Aggiorna ora</button><button class="back" data-a="reset">Cambia club</button></div>`:""}</header><div class="tabs">${T.map(t=>`<button data-a="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("")}</div>${view}`;
  const q=document.getElementById("q");if(q&&S.q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  paint()}
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;let top=1;
  if(a==="tab"){S.tab=v;S.p=null;S.o=null}else if(a==="pl")S.p=+v;else if(a==="pb")S.p=null;else if(a==="op")S.o=+v;else if(a==="ob")S.o=null;
  else if(a==="mod"){S.mod=v;LS.s("mod",v);suggest();top=0}else if(a==="sug"){suggest();top=0}else if(a==="cmp"){S.cmpOn=!S.cmpOn;top=0}
  else if(a==="send"){const i=document.getElementById("msg");ask(i.value);i.value="";return}
  else if(a==="ex"){ask(v);return}
  else if(a==="csearch"){search("cs");return}else if(a==="osearch"){search("os");return}else if(a==="pick"){start(S.res[+v]);return}else if(a==="opick"){pickOpp(S.res[+v]);return}else if(a==="fsave"){saveForm();top=0}else if(a==="fload"){loadForm(+v);top=0}else if(a==="fdel"){delForm(+v);top=0}else if(a==="fcopy"){copyForm(+v);return}else if(a==="fimp"){importForm();top=0}else if(a==="refresh"){refresh(true);return}else if(a==="reset"){LS.s("club",null);S.ready=false;S.res=[];S.msg="";render();return}
  else if(a==="askopp"){const o=O[+v];S.tab="ai";S.p=null;S.o=null;render();ask(`Come affrontiamo ${o.n}? Dammi un piano partita usando i dati del loro ultimo scontro con noi.`);scrollTo(0,0);return}
  render();if(top)scrollTo(0,0)});
app.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.k!==undefined){if(t.value)S.as[t.dataset.k]=t.value;else delete S.as[t.dataset.k];LS.s("as",S.as);render()}
  else if(t.id==="cA"||t.id==="cB"){S.cmp=[+document.getElementById("cA").value,+document.getElementById("cB").value];render()}});
app.addEventListener("input",e=>{const t=e.target;if(t.id==="q"){S.q=t.value;render()}else if(t.id==="notes"){S.notes=t.value;LS.s("notes",t.value)}});
app.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target;if(t.id==="msg"){ask(t.value);t.value=""}else if(t.id==="cs"||t.id==="os")search(t.id)});
if(API){const sv=LS.g("club",null);if(sv)start(sv)}
render();
</script>
</body>
