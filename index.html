<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Sisal FC 2021 - Dashboard EA Sports FC Pro Clubs" />
  <title>Sisal FC 2021 | Pro Clubs Hub</title>

  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111c31;
      --card: #1e293b;
      --card-2: #243247;
      --border: rgba(148, 163, 184, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --blue-2: #2563eb;
      --cyan: #22d3ee;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #facc15;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      --radius: 18px;
      --nav-height: 78px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 50% -10%, rgba(59, 130, 246, 0.18), transparent 28%),
        linear-gradient(180deg, #0f172a 0%, #0b1324 100%);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a,
    select,
    textarea {
      touch-action: manipulation;
    }

    button {
      border: 0;
    }

    .app {
      min-height: 100vh;
      padding-bottom: calc(var(--nav-height) + 20px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 14px 16px 12px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.32);
      font-size: 22px;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.08);
    }

    .sync-pill.success .sync-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
    }

    .sync-pill.error .sync-dot {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
    }

    main {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
    }

    .screen {
      display: none;
      animation: screenIn 0.22s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        radial-gradient(circle at 100% 0%, rgba(34, 211, 238, 0.13), transparent 34%),
        linear-gradient(145deg, rgba(30, 41, 59, 0.98), rgba(24, 37, 58, 0.96));
      box-shadow: var(--shadow);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .club-badge {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: rgba(59, 130, 246, 0.13);
      border: 1px solid rgba(59, 130, 246, 0.24);
      font-size: 26px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .meta-chip {
      padding: 7px 10px;
      background: rgba(15, 23, 42, 0.52);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
    }

    .section-title {
      margin: 20px 0 10px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      margin: -2px 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.98), rgba(27, 39, 57, 0.98));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
    }

    .card-pad {
      padding: 15px;
    }

    .api-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .api-card {
      padding: 14px;
    }

    .api-card h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
    }

    .api-card p {
      margin: 5px 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .api-link {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 13px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .api-link:active {
      transform: scale(0.985);
    }

    .api-link:hover {
      filter: brightness(1.06);
    }

    .url-copy {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      min-width: 0;
      opacity: 0.88;
      font-weight: 500;
    }

    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: #0d1729;
      color: var(--text);
      border-radius: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus,
    select:focus {
      border-color: rgba(59, 130, 246, 0.78);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .json-input {
      min-height: 190px;
      resize: vertical;
      padding: 12px;
      font-size: 11px;
      line-height: 1.55;
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
        monospace;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn,
    .quick-btn {
      min-height: 46px;
      border-radius: 13px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    .primary-btn {
      background: linear-gradient(145deg, var(--blue), var(--blue-2));
      color: white;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
    }

    .secondary-btn {
      background: #243247;
      color: #e2e8f0;
      border: 1px solid var(--border);
    }

    .danger-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .danger-btn:active,
    .quick-btn:active {
      transform: scale(0.985);
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .danger-btn:hover,
    .quick-btn:hover {
      filter: brightness(1.06);
    }

    .primary-btn:disabled,
    .secondary-btn:disabled,
    .quick-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .stat-card {
      padding: 14px;
      min-height: 92px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 7px;
      font-size: 26px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .stat-extra {
      margin-top: 7px;
      color: #cbd5e1;
      font-size: 10px;
    }

    .players-list {
      display: grid;
      gap: 10px;
    }

    .player-card {
      padding: 13px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.48);
      border: 1px solid var(--border);
    }

    .player-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 11px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.28), rgba(34, 211, 238, 0.12));
      border: 1px solid rgba(59, 130, 246, 0.22);
      font-size: 17px;
      font-weight: 900;
    }

    .player-name {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      word-break: break-word;
    }

    .player-id {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .mini-stat {
      min-width: 0;
      padding: 9px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.76);
      border: 1px solid rgba(148, 163, 184, 0.08);
    }

    .mini-label {
      color: var(--muted);
      display: block;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mini-value {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 900;
    }

    .empty-state {
      padding: 30px 18px;
      text-align: center;
      border: 1px dashed rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.35);
    }

    .empty-icon {
      font-size: 28px;
    }

    .empty-state h3 {
      margin: 9px 0 5px;
      font-size: 15px;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .rank-card {
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .rank-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .rank-title {
      font-size: 14px;
      font-weight: 900;
    }

    .rank-subtitle {
      font-size: 10px;
      color: var(--muted);
    }

    .rank-list {
      display: grid;
      gap: 8px;
    }

    .rank-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.42);
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.08);
    }

    .rank-pos {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(59, 130, 246, 0.12);
      color: #bfdbfe;
      font-size: 11px;
      font-weight: 900;
    }

    .rank-name {
      min-width: 0;
    }

    .rank-name strong {
      display: block;
      font-size: 12px;
      word-break: break-word;
    }

    .rank-name span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
    }

    .rank-value {
      text-align: right;
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .field-controls {
      display: grid;
      gap: 10px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 800;
    }

    .select-wrap {
      position: relative;
    }

    select {
      min-height: 47px;
      padding: 0 42px 0 13px;
      appearance: none;
      font-size: 13px;
      font-weight: 800;
    }

    .select-arrow {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 14px;
    }

    .pitch-card {
      padding: 12px;
      margin-top: 12px;
    }

    .pitch {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      aspect-ratio: 0.72;
      overflow: hidden;
      border-radius: 20px;
      background:
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 0 12.5%,
          transparent 12.5% 25%,
          rgba(255, 255, 255, 0.025) 25% 37.5%,
          transparent 37.5% 50%,
          rgba(255, 255, 255, 0.025) 50% 62.5%,
          transparent 62.5% 75%,
          rgba(255, 255, 255, 0.025) 75% 87.5%,
          transparent 87.5%
        ),
        linear-gradient(180deg, #18382d 0%, #1b4938 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.18);
    }

    .pitch::before {
      content: "";
      position: absolute;
      inset: 4%;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 2px;
    }

    .pitch-half {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 50%;
      height: 2px;
      background: rgba(255, 255, 255, 0.42);
      transform: translateY(-1px);
    }

    .pitch-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 27%;
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .box {
      position: absolute;
      left: 21%;
      width: 58%;
      height: 17%;
      border: 2px solid rgba(255, 255, 255, 0.42);
    }

    .box.top {
      top: 4%;
      border-top: 0;
    }

    .box.bottom {
      bottom: 4%;
      border-bottom: 0;
    }

    .player-node {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 56px;
      max-width: 78px;
      padding: 7px 7px 6px;
      border-radius: 12px;
      text-align: center;
      background: rgba(15, 23, 42, 0.91);
      border: 1px solid rgba(96, 165, 250, 0.55);
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.22);
    }

    .player-node strong {
      display: block;
      color: #dbeafe;
      font-size: 9px;
      line-height: 1.1;
      font-weight: 900;
    }

    .player-node span {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
      font-size: 8px;
      line-height: 1.05;
    }

    .formation-title {
      margin: 12px 0 0;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
    }

    .formation-note {
      margin: 4px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .role-card {
      padding: 11px;
      border-radius: 13px;
      border: 1px solid rgba(148, 163, 184, 0.09);
      background: rgba(15, 23, 42, 0.46);
    }

    .role-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .role-name {
      font-size: 11px;
      font-weight: 900;
    }

    .role-tag {
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.11);
      color: #bfdbfe;
      font-size: 8px;
      font-weight: 900;
    }

    .role-card p {
      margin: 7px 0 0;
      color: #cbd5e1;
      font-size: 10px;
      line-height: 1.45;
    }

    .notes {
      min-height: 130px;
      resize: vertical;
      padding: 12px;
      font-size: 12px;
      line-height: 1.55;
    }

    .match-list {
      display: grid;
      gap: 10px;
    }

    .match-card {
      padding: 13px;
    }

    .match-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }

    .match-date {
      color: var(--muted);
      font-size: 10px;
    }

    .match-type {
      font-size: 9px;
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.1);
      color: #bfdbfe;
      font-weight: 800;
    }

    .match-score {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 9px;
    }

    .team-name {
      font-size: 12px;
      font-weight: 800;
      word-break: break-word;
    }

    .team-name.right {
      text-align: right;
    }

    .score {
      min-width: 62px;
      text-align: center;
      font-size: 23px;
      font-weight: 950;
      letter-spacing: -0.05em;
    }

    .result {
      margin-top: 9px;
      text-align: center;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .result.win {
      color: #86efac;
    }

    .result.loss {
      color: #fca5a5;
    }

    .result.draw {
      color: #fde68a;
    }

    .result.unknown {
      color: var(--muted);
    }

    .ai-box {
      display: grid;
      gap: 11px;
    }

    .ai-intro {
      padding: 14px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 100% 0%, rgba(34, 211, 238, 0.12), transparent 28%),
        rgba(15, 23, 42, 0.46);
      border: 1px solid rgba(59, 130, 246, 0.13);
    }

    .ai-intro h3 {
      margin: 0;
      font-size: 15px;
    }

    .ai-intro p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .quick-btn {
      min-height: 40px;
      padding: 9px 11px;
      background: #243247;
      color: #dbeafe;
      border: 1px solid var(--border);
      font-size: 10px;
    }

    .ai-question {
      min-height: 120px;
      padding: 12px;
      resize: vertical;
      font-size: 12px;
      line-height: 1.5;
    }

    .ai-response {
      min-height: 120px;
      padding: 13px;
      border-radius: 15px;
      background: #0b1425;
      border: 1px solid rgba(148, 163, 184, 0.1);
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.62;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-response.muted {
      color: var(--muted);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-height) + 16px + env(safe-area-inset-bottom));
      transform: translate(-50%, 16px);
      z-index: 100;
      width: min(92vw, 460px);
