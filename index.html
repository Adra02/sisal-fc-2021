<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Dashboard FC Clubs con caricamento manuale dei file JSON.">
  <title>FC Clubs Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">EA SPORTS FC · CLUBS</div>
      <h1 id="clubName">FC CLUBS DASHBOARD</h1>
      <div id="dataStatus" class="status">Nessun dato caricato</div>
    </div>
    <div class="club-badge" id="clubId">—</div>
  </header>

  <section class="upload-card">
    <div class="section-kicker">DATI</div>
    <h2>Carica i tuoi file</h2>
    <p>Seleziona i due file direttamente dal telefono o dal PC. Il sito riconosce automaticamente giocatori e partite.</p>
    <label class="upload-button" for="fileInput">📁 CARICA I FILE</label>
    <input id="fileInput" type="file" accept=".json,.txt,application/json,text/plain" multiple hidden>
    <button id="clearData" class="ghost-button" type="button">Svuota dati</button>
    <div id="fileMessages" class="file-messages"></div>
  </section>

  <main id="content"></main>

  <nav class="bottomnav" aria-label="Navigazione">
    <button class="active" data-tab="team">⚡<span>Squadra</span></button>
    <button data-tab="players">👥<span>Giocatori</span></button>
    <button data-tab="top">🏆<span>Top 3</span></button>
    <button data-tab="pitch">⚽<span>Campo</span></button>
    <button data-tab="matches">🆚<span>Partite</span></button>
    <button data-tab="ai">✦<span>IA</span></button>
  </nav>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
