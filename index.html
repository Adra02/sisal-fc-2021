function dataPage(){const own=getOwn(),opp=getOpp();return shell('I TUOI DATI','Centro dati',`<div class="grid2"><div class="card"><div class="kicker">LA TUA SQUADRA</div><h3>Importa e gestisci i file</h3><p class="muted">I controlli di caricamento sono raccolti qui e non compaiono nelle altre sezioni.</p><div class="data-actions"><button class="btn primary" id="btnOwnPlayers">👤 Carica giocatori</button><button class="btn" id="btnOwnMatches">📝 Sostituisci file partite</button><button class="btn" id="btnOwnBoth">📦 Carica giocatori + partite</button><button class="btn danger" id="btnClearOwn">🗑️ Cancella dati squadra</button></div><input class="hidden" id="ownPlayers" type="file" accept=".json,.txt,application/json,text/plain"><input class="hidden" id="ownMatches" type="file" accept=".json,.txt,application/json,text/plain"><input class="hidden" id="ownBoth" type="file" accept=".json,.txt,application/json,text/plain" multiple></div><div class="card"><div class="kicker">DATI AVVERSARIO</div><h3>Prepara lo scouting</h3><p class="muted">Carica i dati che vuoi usare nella sezione Avversario. Restano separati dalla tua squadra.</p><div class="data-actions"><button class="btn primary" id="opBoth">🕵️ Carica giocatori + partite</button><button class="btn" id="opPlayers">👤 Solo giocatori</button><button class="btn" id="opMatches">📝 Solo partite</button><button class="btn danger" id="clearOpp">🗑️ Cancella dati avversario</button></div><input class="hidden" id="opBothInput" type="file" accept=".json,.txt,application/json,text/plain" multiple><input class="hidden" id="opPlayersInput" type="file" accept=".json,.txt,application/json,text/plain"><input class="hidden" id="opMatchesInput" type="file" accept=".json,.txt,application/json,text/plain"></div></div><div class="grid3" style="margin-top:10px"><div class="card"><h3>📦 File squadra</h3><div class="muted">Giocatori caricati: <b>${own.players.length}</b></div><div class="muted">Partite archiviate: <b>${own.matches.length}</b></div></div><div class="card"><h3>🕵️ File avversario</h3><div class="muted">Giocatori caricati: <b>${opp.players.length}</b></div><div class="muted">Partite archiviate: <b>${opp.matches.length}</b></div></div><div class="card"><h3>📐 Regole analisi</h3><div class="muted">Squadra/avversario: ultime 5 partite</div><div class="muted">Giocatori: tutte le partite disponibili</div><div class="muted">Squadra: ultime 5 · Giocatori: totale disponibile</div><div class="muted">Pass e tackle: riusciti ÷ tentati</div></div></div><div class="messages" id="ownMessages"></div>`) }
function render(){setHeader();const x=state.tab;el('content').innerHTML=x==='team'?teamPage():x==='players'?playersPage():x==='top'?topPage():x==='pitch'?pitchPage():x==='matches'?matchesPage():x==='opponent'?opponentPage():x==='data'?dataPage():aiPage();document.querySelectorAll('.bottomnav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));bind();updateAICoverage();}
async function loadKnowledge(){if(location.protocol==='file:'){state.knowledge=null;return}try{const r=await fetch('./knowledge/fc27-knowledge.json',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);state.knowledge=await r.json();state.knowledgeError=''}catch(e){state.knowledge=null;state.knowledgeError=e.message||'impossibile caricare la base di conoscenza'}}
function updateAICoverage(){const d=getOwn(),p=d.players,r5=windowSummary(d,5),node=el('aiCoverage');if(node)node.textContent=` · Finestra IA: ${r5.sample}/5 partite · ${r5.wins}-${r5.draws}-${r5.losses} · ${r5.goals} gol fatti / ${r5.against} subiti · passaggi ${r5.passMade}/${r5.passAttempts} (${r5.passRate==null?'—':r5.passRate.toFixed(1)+'%'}) · contrasti ${r5.tackleMade}/${r5.tackleAttempts} (${r5.tackleRate==null?'—':r5.tackleRate.toFixed(1)+'%'}) · voti disponibili ${p.filter(x=>x.rating>0&&x.rating<=10).length}/${p.length}${r5.invalidPassRows||r5.invalidTackleRows?` · dati anomali ignorati: pass ${r5.invalidPassRows}, tackle ${r5.invalidTackleRows}`:''}.`;}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})});const f=el('formation');if(f)f.onchange=()=>{state.formation=f.value;jset(K.formation,state.formation);render()};const auto=el('autoLineup');if(auto)auto.onclick=autoLineup;const clear=el('clearLineup');if(clear)clear.onclick=()=>{state.lineups[state.formation]={};jset(K.lineups,state.lineups);render()};document.querySelectorAll('[data-slot]').forEach(s=>s.onchange=()=>{state.lineups[state.formation]||={};state.lineups[state.formation][s.dataset.slot]=s.value;jset(K.lineups,state.lineups);render()});document.querySelectorAll('[data-tactic]').forEach(r=>r.oninput=()=>{state.tactics[r.dataset.tactic]=num(r.value);jset(K.tactics,state.tactics);const o=el('out_'+r.dataset.tactic);if(o)o.textContent=r.value;if(r.dataset.tactic==='lineHeight')document.querySelectorAll('[data-pitch-slot]').forEach(dot=>{const q=adjustedPitchPosition(dot.dataset.pitchRole,num(dot.dataset.x),num(dot.dataset.y),num(r.value));dot.style.left=q.x+'%';dot.style.top=q.y+'%';});});document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>playerModal(b.dataset.player));document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{const d=el('det_'+b.dataset.match);if(d)d.classList.toggle('hidden')});const ps=el('playerSearch'),pp=el('playerPos');if(ps&&pp){const update=()=>{const q=ps.value.toLowerCase(),pos=pp.value;document.querySelectorAll('#playerRows tr').forEach(row=>{const name=row.querySelector('.name b')?.textContent.toLowerCase()||'',p=row.querySelector('.name small')?.textContent||'';row.style.display=(!q||name.includes(q))&&(!pos||p===pos)?'':'none'})};ps.oninput=update;pp.onchange=update}const ms=el('matchSearch'),mr=el('matchResult');if(ms&&mr){const update=()=>{const q=ms.value.toLowerCase(),r=mr.value;document.querySelectorAll('#matchGrid .match-card').forEach(card=>{const t=card.textContent.toLowerCase(),rr=card.querySelector('.result-pill')?.className||'';let show=!q||t.includes(q);if(r==='W')show=show&&rr.includes('win');if(r==='D')show=show&&rr.includes('draw');if(r==='L')show=show&&rr.includes('loss');card.style.display=show?'':'none'})};ms.oninput=update;mr.onchange=update}document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=el('aiQ');if(q)q.value=b.dataset.q});const ask=el('askAI');if(ask)ask.onclick=()=>callAI(el('aiQ').value,'normal');const ownPBtn=el('btnOwnPlayers'),ownPInput=el('ownPlayers');if(ownPBtn&&ownPInput)ownPBtn.onclick=()=>ownPInput.click();if(ownPInput)ownPInput.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await importFiles(fs,'players',false)};const ownMBtn=el('btnOwnMatches'),ownMInput=el('ownMatches');if(ownMBtn&&ownMInput)ownMBtn.onclick=()=>ownMInput.click();if(ownMInput)ownMInput.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await importFiles(fs,'matches',false,'replace')};const ownBB=el('btnOwnBoth'),ownBI=el('ownBoth');if(ownBB&&ownBI)ownBB.onclick=()=>ownBI.click();if(ownBI)ownBI.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await importFiles(fs,null,false)};const clearOwn=el('btnClearOwn');if(clearOwn)clearOwn.onclick=()=>{if(!confirm('Cancellare tutti i dati della tua squadra dal browser?'))return;state.players=[];state.matches=[];state.lineups={};jdel(K.players);jdel(K.matches);jdel(K.lineups);render()};const opBoth=el('opBoth'),opBothInput=el('opBothInput');if(opBoth&&opBothInput)opBoth.onclick=()=>opBothInput.click();if(opBothInput)opBothInput.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await importFiles(fs,null,true)};const opP=el('opPlayers'),opPI=el('opPlayersInput');if(opP&&opPI)opP.onclick=()=>opPI.click();if(opPI)opPI.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await importFiles(fs,'players',true)};const opM=el('opMatches'),opMI=el('opMatchesInput');if(opM&&opMI)opM.onclick=()=>opMI.click();if(opMI)opMI.onchange=async e=>{const fs=[...e.target.files];e.target.value='';await importFiles(fs,'matches',true,'replace')};const clearOpp=el('clearOpp');if(clearOpp)clearOpp.onclick=()=>{state.opPlayers=[];state.opMatches=[];jdel(K.opPlayers);jdel(K.opMatches);render()};const opAI=el('askOpponentAI');if(opAI)opAI.onclick=()=>callAI('Analizza questo avversario in profondità usando solo i dati caricati. Per la squadra avversaria usa esclusivamente le ultime 5 partite e per i giocatori usa tutti i dati disponibili. Dimmi: punti forti, punti deboli, giocatori chiave, pattern offensivi e difensivi ricavabili, cosa dobbiamo limitare, dove possiamo attaccare, come impostare la gara e quali dati non bastano per essere certi. Confronta dove utile con la nostra squadra.','opponent')}
function playerModal(id){const p=getOwn().players.find(x=>String(x.id)===String(id));if(!p)return;const pass=playerVerifiedStat(p,'pass'),tackle=playerVerifiedStat(p,'tackle');el('modalRoot').innerHTML=`<div class="modal" id="playerModal"><div class="modal-inner"><div class="modal-head"><div><div class="kicker">SCHEDA GIOCATORE</div><h2 style="margin:5px 0">${esc(p.name)}</h2><div class="muted">${esc(p.position||'Posizione non indicata')}</div></div><button class="close" onclick="document.getElementById('modalRoot').innerHTML=''">✕</button></div><div class="stats-grid"><div class="stat"><strong>${p.ovr||'—'}</strong><span>OVR</span></div><div class="stat"><strong>${p.games||0}</strong><span>Presenze</span></div><div class="stat"><strong>${p.goals||0}</strong><span>Gol</span></div><div class="stat"><strong>${p.assists||0}</strong><span>Assist</span></div><div class="stat"><strong>${p.rating?num(p.rating).toFixed(2):'—'}</strong><span>Voto</span></div><div class="stat"><strong>${p.games?((p.goals+p.assists)/p.games).toFixed(2):'0.00'}</strong><span>G+A/PG</span></div><div class="stat"><strong>${pass.rate==null?'—':pass.rate.toFixed(1)+'%'}</strong><span>Pass%</span><small style="display:block;color:var(--muted);margin-top:3px">${pass.attempts?`${pass.made}/${pass.attempts}`:'dati non disponibili'}</small></div><div class="stat"><strong>${tackle.rate==null?'—':tackle.rate.toFixed(1)+'%'}</strong><span>Tackle%</span><small style="display:block;color:var(--muted);margin-top:3px">${tackle.attempts?`${tackle.made}/${tackle.attempts}`:'dati non disponibili'}</small></div></div><div class="grid2" style="margin-top:10px"><div class="card"><h3>Produzione</h3><div class="bar-row"><span>Gol/PG</span><div class="bar-bg"><div class="bar" style="width:${Math.min(100,(p.games?p.goals/p.games:0)*100)}%"></div></div><b>${p.games?(p.goals/p.games).toFixed(2):'0.00'}</b></div><div class="bar-row"><span>Assist/PG</span><div class="bar-bg"><div class="bar" style="width:${Math.min(100,(p.games?p.assists/p.games:0)*100)}%"></div></div><b>${p.games?(p.assists/p.games).toFixed(2):'0.00'}</b></div></div><div class="card"><h3>Disciplina / difesa</h3><div class="muted">Tiri: ${p.shots||0} · Parate: ${p.saves||0} · Cartellini rossi: ${p.redcards||0}</div></div></div></div></div>`}
window.addEventListener('keydown',e=>{if(e.key==='Escape')el('modalRoot').innerHTML=''})

setHeader();render();loadKnowledge().then(()=>{if(state.tab==='ai')render();});

})();
</script>
