<div class="w"><header><small>EA SPORTS FC 27 · CLUBS</small><h1 id="ttl">Sisal FC 2021</h1></header><nav id="nav"></nav><main id="app"></main></div>

<script id="logic">
"use strict";
const FC=(()=>{
  const num=x=>{if(x===null||x===undefined||x==="")return null;const v=parseFloat(String(x).replace(",","."));return Number.isFinite(v)?v:null};
  const norm=s=>String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  const fmt=(v,d=1)=>(v===null||v===undefined||!Number.isFinite(v))?"N/D":v.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
  const pct=(a,b)=>b>0?a/b*100:null;
  const DL={ATT:"Attacco",CEN:"Centrocampo",DIF:"Difesa",POR:"Porta"};
  function dept(p){const s=norm(p);if(!s)return null;
    if(/goal|keeper|portier|^gk$|^por$/.test(s))return"POR";
    if(/def|difens|back|^cb$|^dc$|terzin/.test(s))return"DIF";
    if(/mid|centro|^cm$|^cdm$|^cam$|median|trequart/.test(s))return"CEN";
    if(/forw|strik|attacc|^att$|^st$|wing|^ala$/.test(s))return"ATT";return null}
  function ovrOf(o,depth=0){if(!o||typeof o!=="object"||depth>3)return null;
    for(const [k,v] of Object.entries(o)){if(/^(ovr|overall|overallrating|prooverall|prooverallstr)$/i.test(k)){const n=num(v);if(n!==null&&n>0)return n}}
    for(const v of Object.values(o)){if(v&&typeof v==="object"){const r=ovrOf(v,depth+1);if(r!==null)return r}}return null}
  const ents=o=>Array.isArray(o)?o.map((v,i)=>[String((v&&(v.clubId||v.id))||i),v]):Object.entries(o||{});
  function normMatch(m){
    if(!m||typeof m!=="object")return null;
    const clubs={};ents(m.clubs).forEach(([id,c])=>{c=c||{};clubs[id]={id,name:(c.details&&c.details.name)||c.name||null,goals:num(c.goals),ga:num(c.goalsAgainst!==undefined?c.goalsAgainst:c.goalsagainst)}});
    const ids=Object.keys(clubs);if(!ids.length)return null;
    ids.forEach(id=>{if(clubs[id].ga===null&&ids.length===2){const o=clubs[ids.find(x=>x!==id)];clubs[id].ga=o.goals}});
    const players={};
    Object.entries(m.players||{}).forEach(([cid,pl])=>{players[cid]=ents(pl).map(([pid,p])=>{p=p||{};return{pid:String(pid),name:String(p.playername||p.name||"").trim(),pos:String(p.pos||""),rating:num(p.rating),goals:num(p.goals)||0,assists:num(p.assists)||0,pm:num(p.passesmade)||0,pa:num(p.passattempts)||0,tm:num(p.tacklesmade)||0,ta:num(p.tackleattempts)||0,shots:num(p.shots)||0,secs:num(p.secondsPlayed),mom:num(p.mom)||0}}).filter(p=>p.name)});
    let ts=num(m.timestamp);if(ts===null)ts=0;if(ts>1e12)ts=Math.floor(ts/1000);
    return{id:String(m.matchId||(ts+"-"+ids.join("-"))),ts,clubs,players}}
  function normMember(m){if(!m||typeof m!=="object")return null;const name=String(m.name||m.playername||"").trim();if(!name)return null;
    const ids=[];Object.entries(m).forEach(([k,v])=>{if(/^(playerid|blazeid|personaid|userid|id)$/i.test(k)&&v!==null&&v!=="")ids.push(String(v))});
    return{name,games:num(m.gamesPlayed!==undefined?m.gamesPlayed:(m.games!==undefined?m.games:(m.PG!==undefined?m.PG:m.appearances))),goals:num(m.goals),assists:num(m.assists),rating:num(m.ratingAve!==undefined?m.ratingAve:m.rating),pos:m.favoritePosition||m.position||"",ovr:ovrOf(m),ids}}
  function mergeMatches(old,add,replace){const map=new Map();(replace?[]:old).concat(add).forEach(m=>map.set(m.id,m));return[...map.values()].sort((a,b)=>b.ts-a.ts)}
  function parseUpload(text){
    let d;const t=String(text||"").trim();
    try{d=JSON.parse(t)}catch(e){const i=[t.indexOf("["),t.indexOf("{")].filter(x=>x>=0);const a=i.length?Math.min(...i):-1;const b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));
      try{d=JSON.parse(t.slice(a,b+1))}catch(e2){const tr=/partiteGiocate|giocatoriDelClub|aggregato|nomegiocatore/i.test(t);return{kind:"error",msg:tr?"Il testo sembra tradotto dal browser (nomi dei campi in italiano). Disattiva la traduzione della pagina EA e ricopia.":"File non leggibile: non è un JSON valido."}}}
    const arr=Array.isArray(d)?d:(d&&Array.isArray(d.matches)?d.matches:(d&&Array.isArray(d.members)?d.members:null));
    if(d&&Array.isArray(d.matches)||(arr&&arr[0]&&(arr[0].clubs||arr[0].matchId)))return{kind:"matches",items:arr.map(normMatch).filter(Boolean)};
    if(d&&Array.isArray(d.members)||(arr&&arr[0]&&arr[0].name!==undefined&&!arr[0].clubInfo))return{kind:"members",items:arr.map(normMember).filter(Boolean)};
    if(arr&&arr[0]&&arr[0].clubInfo)return{kind:"record",items:arr};
    if(arr&&!arr.length)return{kind:"error",msg:"Il file è vuoto: nessun dato."};
    return{kind:"error",msg:"Formato non riconosciuto (atteso: partite, giocatori o record club)."}}
  function view(m,cid){const c=m.clubs[cid];if(!c)return null;const oid=Object.keys(m.clubs).find(k=>k!==cid),o=oid?m.clubs[oid]:null;
    const gf=c.goals,ga=c.ga!==null?c.ga:(o?o.goals:null);if(gf===null||ga===null)return null;
    return{id:m.id,ts:m.ts,gf,ga,res:gf>ga?"V":gf<ga?"P":"N",opp:o?(o.name||oid):"N/D",oppId:oid||null,players:m.players[cid]||[]}}
  const views=(ms,cid)=>ms.map(m=>view(m,cid)).filter(Boolean).sort((a,b)=>b.ts-a.ts);
  function guessClubId(ms){const c={};ms.forEach(m=>Object.keys(m.clubs).forEach(k=>c[k]=(c[k]||0)+1));const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:""}
  function summary(vs){const s={n:vs.length,v:0,d:0,p:0,gf:0,ga:0,pm:0,pa:0,tm:0,ta:0};
    vs.forEach(v=>{s[v.res==="V"?"v":v.res==="P"?"p":"d"]++;s.gf+=v.gf;s.ga+=v.ga;v.players.forEach(p=>{s.pm+=p.pm;s.pa+=p.pa;s.tm+=p.tm;s.ta+=p.ta})});
    s.dr=s.gf-s.ga;s.win=pct(s.v,s.n);s.passPct=pct(s.pm,s.pa);s.tackPct=pct(s.tm,s.ta);return s}
  function aggregate(vs){const map=new Map();
    vs.forEach(v=>v.players.forEach(p=>{if(p.secs!==null&&p.secs<=0)return;const k=norm(p.name);let a=map.get(k);
      if(!a){a={key:k,name:p.name,games:0,goals:0,assists:0,rs:0,rn:0,pm:0,pa:0,tm:0,ta:0,mom:0,dept:{},pids:new Set()};map.set(k,a)}
      a.games++;a.goals+=p.goals;a.assists+=p.assists;a.pm+=p.pm;a.pa+=p.pa;a.tm+=p.tm;a.ta+=p.ta;a.mom+=p.mom;
      if(p.rating!==null){a.rs+=p.rating;a.rn++}const d=dept(p.pos);if(d)a.dept[d]=(a.dept[d]||0)+1;a.pids.add(p.pid)}));return map}
  function buildRows(vs,members){
    const agg=aggregate(vs),idx=new Map();agg.forEach((a,k)=>a.pids.forEach(i=>idx.set(i,k)));
    const rows=[],claimed=new Set();
    (members||[]).forEach(m=>{const k=norm(m.name);let ak=(m.ids||[]).map(i=>idx.get(i)).find(Boolean)||(agg.has(k)?k:null);
      if(ak)claimed.add(ak);const a=ak?agg.get(ak):null;if(m.games===0&&!a)return;
      rows.push({key:k,name:m.name,games:m.games,goals:m.goals,assists:m.assists,rating:m.rating,ovr:m.ovr,assigned:dept(m.pos),agg:a,src:"cumulativo"})});
    agg.forEach((a,k)=>{if(claimed.has(k))return;rows.push({key:k,name:a.name,games:a.games,goals:a.goals,assists:a.assists,rating:a.rn?a.rs/a.rn:null,ovr:null,assigned:null,agg:a,src:"partite caricate"})});
    return rows}
  function recentMap(v5){const map=new Map();
    v5.forEach(v=>v.players.forEach(p=>{if(p.secs!==null&&p.secs<=0)return;const k=norm(p.name);const r=map.get(k)||{games:0,rs:0,rn:0,g:0,a:0};
      r.games++;r.g+=p.goals;r.a+=p.assists;if(p.rating!==null){r.rs+=p.rating;r.rn++}map.set(k,r)}));return map}
  function trendOf(row,recent){const r=recent.get(row.key);
    if(!r||r.games<2)return{label:"Dati insufficienti",cls:"n",games:r?r.games:0,rating:null};
    const rr=r.rn?r.rs/r.rn:null;if(rr===null||row.rating===null)return{label:"Dati insufficienti",cls:"n",games:r.games,rating:rr};
    const d=rr-row.rating;return{label:d>=0.4?"In crescita":d<=-0.4?"In calo":"Stabile",cls:d>=0.4?"up":d<=-0.4?"down":"st",games:r.games,rating:rr,g:r.g,a:r.a}}
  function roleVerdict(row){const d=row.agg?row.agg.dept:{},tot=Object.values(d).reduce((a,b)=>a+b,0);
    const dist=Object.entries(d).sort((a,b)=>b[1]-a[1]).map(([k,c])=>`${DL[k]} ${c}`).join(" · ");
    if(!tot)return{state:"Ruolo da valutare",text:"Nessuna posizione registrata nelle partite caricate.",observed:null,dist};
    const [dom,c]=Object.entries(d).sort((a,b)=>b[1]-a[1])[0],share=c/tot;
    if(tot<4)return{state:"Ruolo da valutare",text:`Campione ridotto (${tot} presenze con posizione): indicazione debole.`,observed:dom,dist};
    if(!row.assigned)return{state:"Ruolo da valutare",text:"Ruolo assegnato N/D: non posso confrontarlo.",observed:dom,dist};
    if(dom===row.assigned)return{state:"Ruolo coerente",text:`Reparto dominante osservato: ${DL[dom]} (${c}/${tot}).`,observed:dom,dist};
    if(share>=0.6)return{state:"Possibile ruolo non ottimale",text:`Registrato soprattutto in ${DL[dom]} (${c}/${tot}) ma assegnato in ${DL[row.assigned]}. È un'inferenza dai dati, non una certezza.`,observed:dom,dist};
    return{state:"Ruolo da valutare",text:`Distribuzione mista (${dist}).`,observed:dom,dist}}
  const level=(n,hi,mid)=>n>=hi?{ico:"🟢",txt:"Campione ampio"}:n>=mid?{ico:"🟡",txt:"Campione medio"}:{ico:"🔴",txt:"Campione ridotto"};
  function top3(rows){
    const take=(arr,cmp)=>arr.sort(cmp).slice(0,3);
    const gl=rows.filter(r=>r.games>0&&r.goals!==null),as=rows.filter(r=>r.games>0&&r.assists!==null),rt=rows.filter(r=>r.rating!==null&&r.games>=3);
    const pa=rows.filter(r=>r.agg&&r.agg.pa>=20),ta=rows.filter(r=>r.agg&&r.agg.ta>=5);
    return{
      gol:take(gl,(a,b)=>b.goals-a.goals||a.games-b.games).map(r=>({name:r.name,value:String(r.goals),raw:`${r.goals} gol in ${r.games} PG`,lv:level(r.games,15,6)})),
      assist:take(as,(a,b)=>b.assists-a.assists||a.games-b.games).map(r=>({name:r.name,value:String(r.assists),raw:`${r.assists} assist in ${r.games} PG`,lv:level(r.games,15,6)})),
      rating:take(rt,(a,b)=>b.rating-a.rating||b.games-a.games).map(r=>({name:r.name,value:fmt(r.rating),raw:`voto medio in ${r.games} PG`,lv:level(r.games,15,6)})),
      passaggi:take(pa,(a,b)=>pct(b.agg.pm,b.agg.pa)-pct(a.agg.pm,a.agg.pa)||b.agg.pa-a.agg.pa).map(r=>({name:r.name,value:fmt(pct(r.agg.pm,r.agg.pa))+"%",raw:`${r.agg.pm}/${r.agg.pa}`,lv:level(r.agg.pa,150,50)})),
      contrasti:take(ta,(a,b)=>pct(b.agg.tm,b.agg.ta)-pct(a.agg.tm,a.agg.ta)||b.agg.ta-a.agg.ta).map(r=>({name:r.name,value:fmt(pct(r.agg.tm,r.agg.ta))+"%",raw:`${r.agg.tm}/${r.agg.ta}`,lv:level(r.agg.ta,40,15)}))}}
  function derive(matches,members,cid){const vs=views(matches,cid),v5=vs.slice(0,5),rows=buildRows(vs,members),recent=recentMap(v5);
    return{vs,v5,sum5:summary(v5),rows,recent,name:(matches.find(m=>m.clubs[cid]&&m.clubs[cid].name)||{clubs:{}}).clubs[cid]?.name||null}}
  return{num,norm,fmt,pct,dept,DL,ovrOf,normMatch,normMember,mergeMatches,parseUpload,view,views,guessClubId,summary,aggregate,buildRows,recentMap,trendOf,roleVerdict,level,top3,derive}
})();
if(typeof module!=="undefined")module.exports=FC;
</script>

<script id="ui">
"use strict";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Formazioni citate nelle fonti per FC 27 (elenco NON verificato come completo per Clubs; righe dal portiere all'attacco).
const FORMATIONS={

"3-4-1-2":[["POR"],["DC","DC","DC"],["ES","CC","CC","ED"],["TRQ"],["ATT","ATT"]],
"3-4-2-1":[["POR"],["DC","DC","DC"],["ES","CC","CC","ED"],["TRQ","TRQ"],["ATT"]],

"4-1-2-1-2":[["POR"],["TS","DC","DC","TD"],["MED"],["CS","CD"],["TRQ"],["ATT","ATT"]],

"4-2-2-2":[["POR"],["TS","DC","DC","TD"],["MED","MED"],["TRQ","TRQ"],["ATT","ATT"]],
"4-2-3-1":[["POR"],["TS","DC","DC","TD"],["MED","MED"],["AS","TRQ","AD"],["ATT"]],
"4-3-1-2":[["POR"],["TS","DC","DC","TD"],["CC","MED","CC"],["TRQ"],["ATT","ATT"]],
"4-3-3":[["POR"],["TS","DC","DC","TD"],["CC","MED","CC"],["AS","ATT","AD"]],
"4-4-1-1":[["POR"],["TS","DC","DC","TD"],["CS","CC","CC","CD"],["TRQ"],["ATT"]],

function layout(fk,dl){const rows=FORMATIONS[fk],R=rows.length,base=rows.map((_,i)=>138-i*(114/(R-1))),sh=(dl-50)/50*9,y=base.slice();

  const tn=["Demo Alfa","Demo Bravo","Demo Charlie","Demo Delta","Demo Echo","Demo Foxtrot"],tp=["forward","forward","midfielder","midfielder","defender","defender"];
  const team=mk(S.clubId,"Squadra Demo",900001,"Avversario Demo",tn,tp,8),on=["Rivale Uno","Rivale Due","Rivale Tre","Rivale Quattro","Rivale Cinque"],op=["forward","midfielder","midfielder","defender","goalkeeper"],opp=mk("900001","Avversario Demo","900002","Altro Club",on,op,7);
  const members=tn.map((n,j)=>({name:n,gamesPlayed:String(10+ri(40)),goals:String(ri(30)),assists:String(ri(20)),ratingAve:(6.2+r()*1.6).toFixed(1),favoritePosition:tp[j]}));
  return{team,members,opp}}
function ingest(kind,text){const p=parseUpload(text);if(p.kind==="error")return{ok:false,msg:p.msg};
  if(p.kind==="record"){if(kind==="opp")return{ok:false,msg:"Il record club va caricato in 'dati squadra'."};S.record=p.items;return{ok:true,msg:"Record club caricato."}}
  if(p.kind==="matches"){const key=kind==="opp"?"opp":"team";S[key]=mergeMatches(S[key],p.items,S.mode==="replace");
    const id=kind==="opp"?oppId():S.clubId,has=S[key].some(m=>m.clubs[id]);return{ok:true,msg:`${p.items.length} partite lette, ${S[key].length} in memoria.${has?"":" Attenzione: nessuna partita contiene il club ID "+id+"."}`}}
  if(p.kind==="members"){const key=kind==="opp"?"oppMembers":"members";S[key]=p.items;return{ok:true,msg:`${p.items.length} giocatori caricati.`}}
  return{ok:false,msg:"Formato non riconosciuto."}}
function vData(){const cnt=(a)=>Array.isArray(a)?a.length:0;
  const up=(kind,title,hint)=>`<div class="card up"><h3>${title}</h3><p class="mut">${hint}</p><label class="btn" for="f-${kind}">Scegli file JSON</label><input id="f-${kind}" type="file" accept=".json,application/json,text/plain" multiple data-kind="${kind}"><label for="t-${kind}" style="margin-top:12px">Oppure incolla il testo</label><textarea id="t-${kind}" rows="3" placeholder="Incolla qui il JSON copiato dalla pagina EA"></textarea><button class="btn sec" style="margin-top:8px" data-a="paste" data-v="${kind}">Carica da testo</button></div>`;
  return `<h2>I tuoi dati</h2>${mockBanner()}${UI.msg?`<div class="card msg ${UI.ok?"ok":"er"}">${esc(UI.msg)}</div>`:""}
  <div class="card"><h3>Stato</h3><p class="mut">Squadra: ${cnt(S.team)} partite · ${cnt(S.members)} giocatori${S.record?" · record club":""}<br>Avversario: ${cnt(S.opp)} partite · ${cnt(S.oppMembers)} giocatori</p>
  <div class="grid"><div><label for="cid">Club ID nostro</label><input id="cid" type="text" inputmode="numeric" value="${esc(S.clubId)}"></div><div><label for="cnm">Nome squadra</label><input id="cnm" type="text" value="${esc(S.clubName)}"></div><div><label for="oid">Club ID avversario (facoltativo)</label><input id="oid" type="text" inputmode="numeric" value="${esc(S.oppId)}" placeholder="auto"></div></div>
  <label for="mode" style="margin-top:12px">Se ci sono già dati</label><select id="mode"><option value="replace" ${S.mode==="replace"?"selected":""}>Sostituisci i dati esistenti</option><option value="merge" ${S.mode==="merge"?"selected":""}>Unisci alle partite già caricate (senza duplicati)</option></select></div>
  ${up("team","Carica dati squadra","Partite del club (clubs/matches) e, se vuoi, il record del club. Puoi scegliere più file insieme.")}
  ${up("players","Carica dati giocatori","Statistiche cumulative dei membri (members/stats): PG, gol, assist, voto, OVR.")}
  ${up("opp","Carica dati avversario","Partite dell'avversario e, se vuoi, i suoi membri. Restano separati dai nostri dati.")}
  <div class="card"><h3>Gestione</h3><div class="chips"><button class="btn sec" data-a="demo">Carica dati di esempio (finti)</button><button class="btn warn" data-a="clr" data-v="team">Cancella dati squadra</button><button class="btn warn" data-a="clr" data-v="opp">Cancella dati avversario</button></div><p class="mut">I dati restano solo nel tuo browser. Disattiva la traduzione automatica del browser quando copi il testo da EA.</p></div>`}

function render(){document.getElementById("ttl").textContent=S.clubName||"Sisal FC 2021";
  document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" ${UI.tab===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("");
  app.innerHTML=({team:vTeam,players:vPlayers,top:vTop,field:vField,matches:vMatches,opp:vOpp,ai:vAI,data:vData}[UI.tab])();
  if(UI.tab==="ai")paintChat()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="tab"){UI.tab=v;UI.profile=null;UI.msg=""}
  else if(a==="prof")UI.profile=v;else if(a==="back")UI.profile=null;
  else if(a==="sort"){UI.sort=UI.sort.k===v?{k:v,d:-UI.sort.d}:{k:v,d:v==="name"?1:-1}}
  else if(a==="send"){const i=document.getElementById("q");const q=i.value;i.value="";ask(q);return}
  else if(a==="ex"){ask(v);return}
  else if(a==="paste"){const t=document.getElementById("t-"+v).value;const r=ingest(v==="players"?"players":v,t);UI.ok=r.ok;UI.msg=r.msg;if(r.ok){S.mock=false;save()}}
  else if(a==="demo"){const m=mockData();S.team=FC.mergeMatches([],m.team.map(FC.normMatch),true);S.members=m.members.map(FC.normMember);S.opp=FC.mergeMatches([],m.opp.map(FC.normMatch),true);S.oppMembers=[];S.oppId="900001";S.record=null;S.mock=true;UI.ok=true;UI.msg="Dati di esempio caricati (sono finti).";save()}
  else if(a==="clr"){if(v==="team"){S.team=[];S.members=[];S.record=null}else{S.opp=[];S.oppMembers=[];S.oppId=""}S.mock=false;UI.ok=true;UI.msg="Dati cancellati.";save()}
  render();if(["tab","prof","back"].includes(a))scrollTo(0,0)});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.matches("input[type=file]")){const kind=t.dataset.kind;let ok=0,msgs=[];for(const f of t.files){const r=ingest(kind,await f.text());msgs.push(`${f.name}: ${r.msg}`);if(r.ok)ok++}
    UI.ok=ok>0;UI.msg=msgs.join(" | ");if(ok){S.mock=false;save()}render();return}
  if(t.id==="fm"){S.formation=t.value;save();render()}
  else if(t.dataset.slot){if(t.value)S.assign[t.dataset.slot]=t.value;else delete S.assign[t.dataset.slot];save();render()}
  else if(t.id==="mode"){S.mode=t.value;save()}
  else if(t.id==="cid"){S.clubId=t.value.trim()||DEF.clubId;save();render()}
  else if(t.id==="cnm"){S.clubName=t.value.trim()||DEF.clubName;save();render()}
  else if(t.id==="oid"){S.oppId=t.value.trim();save();render()}});
document.addEventListener("input",e=>{if(e.target.id==="dl"){S.defLine=+e.target.value;save();const lbl=document.querySelector('label[for="dl"]');if(lbl)lbl.textContent=`Linea difensiva: ${S.defLine<34?"Bassa":S.defLine>66?"Alta":"Media"} (${S.defLine})`;const p=document.querySelector(".pitch");if(p)p.outerHTML=pitch()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q"){const q=e.target.value;e.target.value="";ask(q)}});
render();
</script>
</body>
</html>
